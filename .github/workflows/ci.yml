name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — run the deps-canary job below

env:
  UV_PROJECT_ENVIRONMENT: .uv   # match the Makefile so `uv sync` and `make` share one env

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies (locked)
      run: uv sync --all-extras --dev --frozen

    - name: Lint (ruff check + format --check)
      run: make lint

    - name: Test with coverage
      run: make coverage

    - name: Audit dependencies for known CVEs
      run: make audit
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Solver suite against UNPINNED latest angr / unicorn / pwntools / capstone,
  # so a breaking backend release is caught on a schedule instead of mid-CTF.
  # Weekly (see the cron above) or on demand; never gates a PR.
  deps-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    - name: Set up Python
      run: uv python install 3.13
    - name: Solver suite vs unpinned latest backends
      run: make deps-canary
