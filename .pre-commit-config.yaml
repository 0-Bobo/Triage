repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Keep this rev in step with the `ruff` pin in pyproject's dev group.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Now that CI actually fires (on master), stop a red push before it leaves
  # the machine. Runs only on `git push`, not on every commit.
  - repo: local
    hooks:
      - id: pytest-coverage-gate
        name: pytest (100% coverage gate)
        entry: uv run pytest --cov=triage_web --cov-report= -q
        language: system
        pass_filenames: false
        stages: [pre-push]
